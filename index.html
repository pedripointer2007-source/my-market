<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMarket - Catálogo y Tienda Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="navbar">
        <div class="navbar-brand"><i class="fa-solid fa-store"></i> MyMarket</div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Buscar productos por nombre...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="navbar-actions">
            <button class="login-btn hidden" id="profile-btn" aria-label="Mi Perfil">
                <i class="fa-solid fa-id-card"></i> <span>Perfil</span>
            </button>
            <button class="login-btn hidden" id="logout-btn" aria-label="Cerrar sesión">
                <i class="fa-solid fa-right-from-bracket"></i> <span>Salir</span>
            </button>
            <button class="login-btn" id="login-btn" aria-label="Iniciar sesión">
                <i class="fa-solid fa-user"></i> <span>Iniciar sesión</span>
            </button>
            <div class="cart-trigger" id="cart-btn" aria-label="Ver carrito">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Barra de Navegación por Categorías -->
    <nav class="category-nav-bar" id="category-nav-container">
        <button class="cat-chip active" data-category="all">Todos</button>
        <!-- Las categorías se cargarán dinámicamente aquí -->
    </nav>

    <div class="action-buttons-bar">
        <button class="action-btn action-sell" id="sell-btn">
            <i class="fa-solid fa-tag"></i> Vender producto
        </button>
    </div>

    <main class="main-container">
        <section class="catalog-section">
            <h2 class="section-title" id="catalog-title">Productos Disponibles</h2>
            <div class="products-grid" id="products-container"></div>
        </section>
    </main>

    <!-- Sidebar del Carrito -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-sidebar-header">
            <h3><i class="fa-solid fa-bag-shopping"></i> Tu Carrito</h3>
            <button class="close-sidebar-btn" id="close-cart">&times;</button>
        </div>
        <div class="cart-sidebar-body">
            <div class="cart-items-list" id="cart-items-container"></div>
        </div>
        <div class="cart-sidebar-footer">
            <div class="summary-row">
                <span>Total:</span>
                <span class="total-price">NIO <span id="cart-total-val">0.00</span></span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Proceder al pago</button>
        </div>
    </div>

    <!-- Modal Autenticación -->
    <div class="modal" id="login-modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cuenta de Usuario</h3>
                <button class="close-sidebar-btn" type="button" data-close-modal="login-modal">&times;</button>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo electrónico</label>
                    <input id="login-email" type="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input id="login-password" type="password" required autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button class="pay-btn" type="submit">Entrar</button>
                    <button class="secondary-btn" type="button" data-close-modal="login-modal">Cancelar</button>
                </div>
            </form>
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="register-email">Correo electrónico</label>
                    <input id="register-email" type="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="register-password">Contraseña</label>
                    <input id="register-password" type="password" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Confirmar contraseña</label>
                    <input id="register-password-confirm" type="password" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-actions">
                    <button class="pay-btn" type="submit">Crear cuenta</button>
                    <button class="secondary-btn" type="button" data-close-modal="login-modal">Cancelar</button>
                </div>
            </form>
            <button class="auth-switch-btn" id="show-register-btn" type="button">¿No tienes cuenta? Crear una</button>
            <button class="auth-switch-btn hidden" id="show-login-btn" type="button">Ya tengo una cuenta</button>
        </div>
    </div>

    <!-- Modal Vender / Publicar Producto -->
    <div class="modal" id="sell-modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="sell-modal-title">Publicar producto</h3>
                <button class="close-sidebar-btn" type="button" data-close-modal="sell-modal">&times;</button>
            </div>
            <form id="sell-form">
                <input type="hidden" id="product-id-hidden">
                <div class="form-group">
                    <label for="product-title">Nombre del producto</label>
                    <input id="product-title" type="text" required maxlength="120">
                </div>
                <div class="form-group">
                    <label for="product-category">Categoría</label>
                    <select id="product-category" required></select>
                </div>
                <div class="form-group">
                    <label for="product-price">Precio</label>
                    <input id="product-price" type="number" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="product-currency">Moneda</label>
                    <select id="product-currency">
                        <option value="NIO">NIO</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="product-stock">Unidades disponibles (Stock)</label>
                    <input id="product-stock" type="number" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="product-status">Estado de disponibilidad</label>
                    <select id="product-status">
                        <option value="active">Disponible / Activo</option>
                        <option value="paused">Pausado</option>
                        <option value="sold_out">Agotado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="product-condition">Condición</label>
                    <select id="product-condition" required>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Seminuevo">Seminuevo</option>
                        <option value="Usado" selected>Usado</option>
                        <option value="Reacondicionado">Reacondicionado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="product-location">Ubicación</label>
                    <input id="product-location" type="text" required>
                </div>
                <div class="form-group">
                    <label for="product-phone">Teléfono / WhatsApp de contacto</label>
                    <input id="product-phone" type="tel" required placeholder="+505 8888 8888">
                </div>
                <div class="form-group">
                    <label for="product-image">Imagen del producto</label>
                    <input id="product-image" type="file" accept="image/*">
                    <img id="product-image-preview" class="upload-preview hidden" alt="Vista previa">
                </div>
                <div class="form-actions">
                    <button class="pay-btn" type="submit" id="save-product-btn">Guardar producto</button>
                    <button class="secondary-btn" type="button" data-close-modal="sell-modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Perfil de Usuario -->
    <div class="modal" id="profile-modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Mi Perfil de Usuario</h3>
                <button class="close-sidebar-btn" type="button" data-close-modal="profile-modal">&times;</button>
            </div>
            <form id="profile-form">
                <div class="profile-avatar-container" style="text-align: center; margin-bottom: 15px;">
                    <img id="profile-avatar-preview" src="https://via.placeholder.com/100" alt="Avatar" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0;"><br>
                    <span id="profile-online-badge" class="online-badge" style="display: inline-block; background: #10b981; color: white; padding: 2px 10px; border-radius: 12px; font-size: 11px; margin-top: 6px; font-weight: 600;"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> En línea</span>
                </div>
                <div class="form-group">
                    <label for="profile-avatar-file">Cambiar foto de perfil</label>
                    <input id="profile-avatar-file" type="file" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="profile-name">Nombre completo</label>
                    <input id="profile-name" type="text" required>
                </div>
                <div class="form-group">
                    <label for="profile-phone">Teléfono personal</label>
                    <input id="profile-phone" type="tel" required>
                </div>
                <div class="form-actions">
                    <button class="pay-btn" type="submit">Actualizar Perfil</button>
                    <button class="secondary-btn" type="button" data-close-modal="profile-modal">Cerrar</button>
                </div>
            </form>
            <section class="seller-notifications-section">
                <h4>Pedidos recibidos</h4>
                <div id="seller-notifications-list"><p>No hay pedidos recibidos.</p></div>
            </section>
        </div>
    </div>

    <!-- Modal Vista Previa Producto -->
    <div class="modal" id="product-preview-modal" aria-hidden="true">
        <div class="modal-content product-detail-content">
            <div class="modal-header">
                <h3>Detalles del producto</h3>
                <button class="close-sidebar-btn" type="button" data-close-modal="product-preview-modal">&times;</button>
            </div>
            <div id="product-preview-content"></div>
        </div>
    </div>

    <!-- Modal Pago -->
    <div class="modal" id="payment-modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirmar pedido</h3>
                <button class="close-sidebar-btn" type="button" data-close-modal="payment-modal">&times;</button>
            </div>
            <form id="payment-form">
                <div class="form-group">
                    <label for="payment-name">Nombre completo</label>
                    <input id="payment-name" type="text" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="payment-phone">Teléfono</label>
                    <input id="payment-phone" type="tel" required autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="payment-address">Dirección de entrega</label>
                    <textarea id="payment-address" required rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button class="pay-btn" type="submit">Confirmar pedido</button>
                    <button class="secondary-btn" type="button" data-close-modal="payment-modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="JS.js"></script>
</body>
</html>
